# Free, open-source ops monitoring for the Module 1 (HA/failover) demo:
# mongodb_exporter scrapes Atlas via the standard MongoDB wire protocol,
# Prometheus stores the time series, Grafana visualizes it. No Atlas Charts,
# no paid Grafana plugin — just the pattern most shops already run.
#
# Setup:
#   cp .env.example .env   # fill in ATLAS_URI (needs at least clusterMonitor role)
#   docker compose up -d
#   open http://localhost:3000  (admin / admin, change on first login)
#   A "MongoDB ReplSet — AMEX Ops Dashboard" is auto-provisioned and appears
#   on the home page. It's hand-built against this exact exporter version's
#   metric names (mongodb_ss_*, mongodb_members_*) — see README.md for why
#   pre-built community dashboards on grafana.com didn't work here.

services:
  mongodb_exporter:
    image: percona/mongodb_exporter:0.44
    restart: unless-stopped
    env_file:
      - .env
    command:
      - "--mongodb.uri=${ATLAS_URI}"
      - "--web.listen-address=:9216"
      # Atlas SRV URIs resolve to multiple hosts (a replica set) — direct
      # connect (the exporter's default) can't be used against those.
      - "--no-mongodb.direct-connect"
      # Deliberately NOT --collect-all: this cluster has other sample
      # databases on it, and the collstats/indexstats collectors fan out
      # $collStats/$indexStats calls across every collection in every
      # database, which exhausted the connection pool and starved the
      # collector that actually matters below. diagnosticdata +
      # replicasetstatus give everything the Module 1 HA story needs
      # (replication lag, primary/secondary state, op counters,
      # connections) without the fan-out.
      - "--collector.diagnosticdata"
      - "--collector.replicasetstatus"
    ports:
      - "9216:9216"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - mongodb_exporter

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-provisioning/dashboard-json:/etc/grafana/dashboard-json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
